<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loja Zentrix Keys</title>
  <script src="/loja.js" defer></script>
  <style>
    :root{color-scheme:dark;font:16px system-ui,sans-serif;background:#101012;color:#f7f2e7}
    main{max-width:34rem;margin:3rem auto;padding:0 1rem}
    h1{margin:.5rem 0}.brand{color:#f1ca70;font-weight:700;letter-spacing:.12em}
    p{line-height:1.5} form,section{background:#1c1c20;border:1px solid #383533;border-radius:1rem;padding:1.25rem}
    label{display:block;margin:.75rem 0}input,select,textarea,button{font:inherit;box-sizing:border-box}
    input,select,textarea{width:100%;margin:.3rem 0;padding:.7rem;border:1px solid #645b4b;border-radius:.5rem;background:#111}
    button{background:#f1ca70;color:#16110a;border:0;border-radius:.5rem;padding:.75rem 1rem;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait} img{display:block;width:14rem;max-width:100%;margin:1rem auto} [hidden]{display:none!important}
    output{display:block;margin:.6rem 0;overflow-wrap:anywhere;font:700 1.1rem monospace}
  </style>
</head>
<body>
<main>
  <span class="brand">ZENTRIX KEYS</span>
  <h1>Compre sua key</h1>
  <p>Pague por Pix e receba a key nesta página após a confirmação.</p>
  <form id="purchase">
    <label>Plano
      <select name="hours">
        <option value="336">14 dias · R$ 60,00</option>
        <option value="720">30 dias · R$ 100,00</option>
      </select>
    </label>
    <fieldset id="customer-data" style="border:0;padding:0;margin:0">
    <label>Nome completo <input name="name" autocomplete="name" maxlength="255" required></label>
    <label>E-mail <input name="email" type="email" autocomplete="email" maxlength="254" required></label>
    <label>CPF <input name="cpf" inputmode="numeric" maxlength="14" required></label>
    <label>Celular com DDD <input name="phone" type="tel" autocomplete="tel-national" maxlength="16" required></label>
    <p>Esses dados são enviados ao PicPay para criar a cobrança.</p>
    </fieldset>
    <button>Gerar Pix</button>
  </form>
  <p id="status" role="status"></p>
  <section id="order" hidden aria-label="Seu pedido">
    <div id="payment" hidden>
      <p id="pix-reference" hidden></p>
      <img id="qr" alt="QR Code Pix" hidden>
      <label>Pix Copia e Cola <textarea id="pix" readonly rows="3"></textarea></label>
      <button id="copy-pix" type="button">Copiar Pix</button>
    </div>
    <form id="receipt-form" hidden>
      <label>Imagem do comprovante <input id="receipt-image" type="file" accept="image/png,image/jpeg" required></label>
      <p>PNG ou JPG de até 2 MB. A key fica disponível após a conferência.</p>
      <button type="submit">Enviar comprovante</button>
      <p id="receipt-error" role="status"></p>
    </form>
    <div id="delivery" hidden>
      <strong>Sua key</strong>
      <output id="key"></output>
      <button id="copy-key" type="button">Copiar key</button>
    </div>
    <p><button id="reset" type="button" hidden>Voltar à loja</button></p>
  </section>
</main>
</body>
</html>
